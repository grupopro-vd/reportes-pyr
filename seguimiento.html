<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de hallazgos · PRO EHS</title>
<meta name="theme-color" content="#1d1d1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRO EHS">
<style>
:root{--red:#bd0926;--red-dark:#8e0719;--black:#1d1d1b;--bg:#f2f2f2;--muted:#5c5c5c;--line:#e4e4e8;
  --ok:#16623f;--ok-bg:#e3f4ea;--mid:#9a6700;--mid-bg:#fdf0d5;--bad:#b3261e;--bad-bg:#fde4e2;--blue:#1d4ed8;--blue-bg:#e6edfd;--grey-bg:#eeeeee}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--black);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
.top{background:linear-gradient(120deg,var(--black) 0%,var(--black) 52%,var(--red-dark) 82%,var(--red) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px}
.top .in{max-width:860px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;background:rgba(255,255,255,.12);padding:7px 12px;border-radius:9px}
.top h1{margin:12px 0 2px;font-size:22px}.top p{margin:0;color:#e3e3e3;font-size:13px}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,textarea,button{font:inherit}
.bar select,.bar input{height:42px;border:1px solid #d4d4d8;border-radius:10px;padding:0 10px;background:#fff;font-size:15px;min-width:0}
.bar select{flex:1 1 200px}.bar input[type=month]{flex:0 1 170px}
.sync{font-size:12px;color:var(--muted);margin:-4px 2px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync button{border:0;background:none;color:var(--red);font-weight:bold;cursor:pointer;padding:0;font-size:12px}
.kpis{display:grid;grid-template-columns:1.3fr repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpis{grid-template-columns:1.4fr repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi b{display:block;font-size:24px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted);font-weight:bold}
.kpi.main{grid-row:span 2;display:flex;flex-direction:column;justify-content:center;cursor:default}
.kpi.main b{font-size:38px}.kpi.on{outline:2px solid var(--black)}
@media(min-width:640px){.kpi.main{grid-row:auto}}
.meter{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%}
.c-ok{color:var(--ok)}.c-mid{color:var(--mid)}.c-bad{color:var(--bad)}.c-blue{color:var(--blue)}
.bg-ok{background:var(--ok)}.bg-mid{background:#d99a00}.bg-bad{background:var(--bad)}
h2{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.centros{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.crow .n{font-weight:bold}.crow .p{font-weight:bold}.crow .meter{grid-column:1/-1;margin:0}.crow small{grid-column:1/-1;color:var(--muted);font-size:12px}
.list{display:grid;gap:8px}
.act{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.act.late{border-left:5px solid var(--bad)}
.act .t{font-weight:bold;font-size:15px;line-height:1.3}
.act .m{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap}
.act .av{grid-column:1/-1;font-size:13px;background:#f7f7f8;border-radius:8px;padding:6px 8px;white-space:pre-line}
.act .btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pill{align-self:start;white-space:nowrap;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:bold}
.st-Pendiente{background:var(--grey-bg);color:#444}.st-En-proceso{background:var(--mid-bg);color:var(--mid)}.st-Por-aprobar{background:var(--blue-bg);color:var(--blue)}
.st-Realizada{background:var(--ok-bg);color:var(--ok)}.st-Rechazada{background:var(--bad-bg);color:var(--bad)}.st-Atrasada{background:var(--bad);color:#fff}
.btn{border:1.5px solid #d4d4d8;background:#fff;border-radius:10px;height:40px;padding:0 14px;font-size:14px;font-weight:bold;cursor:pointer;color:var(--black);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.dark{background:var(--black);border-color:var(--black);color:#fff}
.btn:disabled{opacity:.5}
.empty{background:#fff;border:1px dashed #ccc;border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.admin{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:14px}
.admin summary{padding:14px;font-weight:bold;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.admin summary::after{content:'▾';color:var(--muted)}.admin[open] summary::after{content:'▴'}
.admin .in{padding:0 14px 14px;display:grid;gap:10px;font-size:14px}
.prev{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev table{border-collapse:collapse;width:100%;font-size:12.5px}.prev th,.prev td{padding:6px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.prev th{position:sticky;top:0;background:#f4f4f6}.prev tr.err td{background:#fff3f2;color:var(--bad)}
.msg{font-size:13.5px;border-radius:10px;padding:10px 12px;line-height:1.45}.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.info{background:#f4f4f6;color:#333}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.sheet{align-items:center}.sheet .box{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.sheet label.f{display:block;font-size:12.5px;font-weight:bold;color:#444;margin:10px 0 4px}
.sheet input[type=text],.sheet input[type=email],.sheet textarea{width:100%;border:1px solid #d4d4d8;border-radius:10px;padding:10px;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative}.seg input{position:absolute;opacity:0}
.seg span{display:flex;align-items:center;justify-content:center;height:44px;border:1.5px solid #d4d4d8;border-radius:10px;font-weight:bold;font-size:14px}
.seg input:checked+span{background:var(--black);color:#fff;border-color:var(--black)}
.ev{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev .ph{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid #ddd}
.ev .ph img{width:100%;height:100%;object-fit:cover}.ev .ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:0}
.ev .doc{font-size:12.5px;background:#f4f4f6;border-radius:8px;padding:6px 8px}
.ev label.add{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed #bbb;border-radius:10px;height:44px;padding:0 12px;font-weight:bold;font-size:13.5px;cursor:pointer}
.ev label.add input{display:none}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
.auth{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.auth .who{flex:1;min-width:180px;line-height:1.35}.auth .who small{display:block;color:var(--muted);font-size:12px}
.ms{display:inline-flex;align-items:center;gap:8px}.ms i{display:grid;grid-template-columns:7px 7px;gap:1px}.ms i b{width:7px;height:7px;display:block}
.bar select{flex:1 1 180px}
.lock{font-size:12px;color:var(--muted)}
.val{background:#fff;border:1px solid #bcd0f7;border-radius:14px;padding:12px 14px;display:grid;gap:6px;font-size:13.5px}
.val .t{font-weight:bold}.val .btns{display:flex;gap:8px;flex-wrap:wrap}
.act .ev-link{grid-column:1/-1;font-size:12.5px}.act .ev-link a{color:var(--blue);font-weight:bold;text-decoration:none}
.seg3{grid-template-columns:repeat(3,1fr)}
.sheet input[type=password],.sheet input[inputmode=numeric]{width:100%;border:1px solid #d4d4d8;border-radius:10px;padding:10px;font-size:18px;letter-spacing:4px}
.st-Por-validar{background:var(--blue-bg);color:var(--blue)}
</style>
<style>
.cr-Alta{background:var(--bad-bg);color:var(--bad)}.cr-Media{background:var(--mid-bg);color:var(--mid)}.cr-Baja{background:var(--ok-bg);color:var(--ok)}
.st-Abierto{background:var(--grey-bg);color:#444}.st-Vencido{background:var(--bad);color:#fff}.st-Cerrado{background:var(--ok-bg);color:var(--ok)}
.act .d{grid-column:1/-1;font-size:14px;line-height:1.4}
.act .lim{font-weight:bold}.act .lim.late{color:var(--bad)}.act .lim.soon{color:var(--mid)}
.act .hist{grid-column:1/-1;font-size:12.5px;color:var(--muted);border-top:1px dashed #e4e4e8;padding-top:6px}
.bar input[type=search]{flex:1 1 200px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="back" href="./">← Inicio</a>
  <h1>Seguimiento de hallazgos</h1>
  <p>Hallazgos abiertos por centro y responsable</p>
</div></header>
<main class="wrap">
  <div class="bar">
    <select id="fCentro" aria-label="Centro"></select>
    <input id="fResp" type="search" placeholder="Buscar responsable o texto" aria-label="Buscar">
  </div>
  <div class="sync" id="sync"></div>
  <div id="view"></div>
  <p class="note">Aparecen los hallazgos registrados en la app desde el 18-10-2026. Para cerrar uno se pide una foto de la corrección, que queda en la carpeta del hallazgo en SharePoint.</p>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="box">
    <h3 id="shT">Actualizar hallazgo</h3>
    <div class="sub" id="shSub"></div>
    <label class="f">Estado</label>
    <div class="seg seg3" style="grid-template-columns:repeat(3,1fr)">
      <label><input type="radio" name="shEst" value="Abierto"><span>Abierto</span></label>
      <label><input type="radio" name="shEst" value="En proceso"><span>En proceso</span></label>
      <label><input type="radio" name="shEst" value="Cerrado"><span>Cerrado</span></label>
    </div>
    <label class="f" for="shCom">Comentario</label>
    <textarea id="shCom" rows="3" placeholder="Qué se corrigió o qué falta"></textarea>
    <label class="f">Foto de la corrección <span id="shEvReq" style="color:var(--bad)">(obligatoria para cerrar)</span></label>
    <div class="ev" id="shEv"><label class="add">📷 Foto o archivo<input id="shEvIn" type="file" accept="image/*,.pdf" multiple></label></div>
    <label class="f" for="shNom">Tu nombre</label>
    <input id="shNom" type="text" placeholder="Nombre y apellido">
    <div id="shMsg" style="margin-top:10px"></div>
    <div class="acts"><button class="btn" id="shCancel" type="button">Cancelar</button><button class="btn pri" id="shGo" type="button">Guardar</button></div>
  </div>
</div>

<script>
(function(){
var CFG={endpoint:'https://script.google.com/macros/s/AKfycbzm9nT8n5zazy7ANUWsryccY5178aI7-Orp1jpUZ33Bgzg2m3h5NH6ka3PDWi1r3YEg9w/exec',key:'GP-PYR-2026',
  sp:'https://grupoprocl.sharepoint.com/sites/PYR/ReportesPYR/'};
var CENTROS=['Walmart Pudahuel','Walmart Peñón','Walmart Lo Aguirre','Líder Lo Barnechea','Líder La Reina','Oficina Grupo Pro','ICB','Transporte TransPRO','Lippi','4 Ruedas'];
var $=function(s){return document.querySelector(s)},$$=function(s){return [].slice.call(document.querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var prof=function(){try{return JSON.parse(LS.get('gpPerfil')||'{}')}catch(e){return {}}};
var now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
var DATA={items:[],at:null},filtro='Pendientes';
function fd(s){return s?s.slice(8,10)+'-'+s.slice(5,7)+'-'+s.slice(0,4):''}
function days(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5)}
function st(h){if(h.estado==='Cerrado')return 'Cerrado';if(h.limite&&h.limite<today)return 'Vencido';return h.estado||'Abierto'}
function load(){
  try{var c=JSON.parse(LS.get('gpHzData')||'null');if(c&&c.items){DATA=c;render()}}catch(e){}
  $('#sync').textContent='Actualizando…';
  return fetch(CFG.endpoint+'?hz=1&key='+encodeURIComponent(CFG.key)+'&t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok)throw new Error((d&&d.error)||'sin datos');DATA={items:d.items||[],at:new Date().toISOString()};LS.set('gpHzData',JSON.stringify(DATA));render();
  }).catch(function(e){render();$('#sync').innerHTML='<div class="msg err">No se pudo actualizar ('+esc(e.message)+'). '+(DATA.items.length?'Se muestra la última copia.':'')+'</div>'});
}
function render(){
  var c=$('#fCentro').value,q=$('#fResp').value.trim().toLowerCase();
  var all=DATA.items.filter(function(h){return (!c||h.centro===c)&&(!q||[h.responsable,h.descripcion,h.tipo,h.area,h.lugar,h.reporta].join(' ').toLowerCase().indexOf(q)>=0)});
  var cnt={Pendientes:0,Vencido:0,'Por vencer':0,'En proceso':0,Cerrado:0};
  all.forEach(function(h){var s=st(h);if(s!=='Cerrado')cnt.Pendientes++;if(s==='Vencido')cnt.Vencido++;if(s==='En proceso')cnt['En proceso']++;if(s==='Cerrado')cnt.Cerrado++;
    if(s!=='Cerrado'&&s!=='Vencido'&&h.limite&&days(h.limite,today)<=7)cnt['Por vencer']++});
  var tot=all.length,cerr=cnt.Cerrado,p=tot?Math.round(cerr/tot*100):null,k=p===null?'':(p>=90?'ok':p>=70?'mid':'bad');
  var h='<div class="kpis"><div class="kpi main"><span>Cerrados</span><b class="c-'+k+'">'+(p===null?'—':p+'%')+'</b><div class="meter"><i class="bg-'+(k||'ok')+'" style="width:'+(p||0)+'%"></i></div><span style="font-weight:normal;margin-top:6px">'+cerr+' de '+tot+' hallazgos</span></div>';
  [['Pendientes','','Abiertos'],['Vencido','c-bad','Vencidos'],['Por vencer','c-mid','Vencen en 7 días'],['Cerrado','c-ok','Cerrados']].forEach(function(x){
    h+='<button type="button" class="kpi'+(filtro===x[0]?' on':'')+'" data-f="'+x[0]+'"><b class="'+x[1]+'">'+cnt[x[0]]+'</b><span>'+x[2]+'</span></button>'});
  h+='</div>';
  var open=all.filter(function(x){return st(x)!=='Cerrado'});
  if(open.length){var by={};open.forEach(function(x){var r=x.responsable||'Sin responsable';(by[r]=by[r]||{n:0,v:0}).n++;if(st(x)==='Vencido')by[r].v++});
    h+='<h2>Abiertos por responsable</h2><div class="centros">'+Object.keys(by).sort(function(a,b){return by[b].v-by[a].v||by[b].n-by[a].n}).map(function(r){
      return '<div class="crow" data-r="'+esc(r)+'"><span class="n">'+esc(r)+'</span><span class="p '+(by[r].v?'c-bad':'')+'">'+by[r].n+'</span><small>'+by[r].n+' abierto'+(by[r].n>1?'s':'')+(by[r].v?' · <b class="c-bad">'+by[r].v+' vencido'+(by[r].v>1?'s':'')+'</b>':'')+'</small></div>'}).join('')+'</div>'}
  var list=all.filter(function(x){var s=st(x);return filtro==='Pendientes'?s!=='Cerrado':filtro==='Por vencer'?(s!=='Cerrado'&&s!=='Vencido'&&x.limite&&days(x.limite,today)<=7):s===filtro});
  var ord={Vencido:0,'En proceso':1,Abierto:2,Cerrado:3},cr={Alta:0,Media:1,Baja:2};
  list.sort(function(a,b){return ord[st(a)]-ord[st(b)]||(cr[a.criticidad]??3)-(cr[b.criticidad]??3)||String(a.limite||'9').localeCompare(String(b.limite||'9'))});
  h+='<h2>'+esc(filtro==='Pendientes'?'Abiertos':filtro==='Vencido'?'Vencidos':filtro==='Cerrado'?'Cerrados':filtro)+' ('+list.length+')</h2>';
  if(!DATA.items.length)h+='<div class="empty">Aún no hay hallazgos registrados desde la app.<br>Cuando alguien envíe un «Reporte de hallazgo», aparecerá aquí para su seguimiento.</div>';
  else if(!list.length)h+='<div class="empty">No hay hallazgos en este grupo'+(c?' para '+esc(c):'')+'.</div>';
  else h+='<div class="list">'+list.map(card).join('')+'</div>';
  $('#view').innerHTML=h;$('#sync').textContent=DATA.at?'Actualizado '+new Date(DATA.at).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'';
  $$('.kpi[data-f]').forEach(function(b){b.onclick=function(){filtro=filtro===b.dataset.f&&filtro!=='Pendientes'?'Pendientes':b.dataset.f;render()}});
  $$('.crow[data-r]').forEach(function(r){r.onclick=function(){$('#fResp').value=r.dataset.r==='Sin responsable'?'':r.dataset.r;render()}});
  $$('[data-ed]').forEach(function(b){b.onclick=function(){openSheet(DATA.items.filter(function(x){return x.id===b.dataset.ed})[0])}});
}
function card(x){var s=st(x),lim='';
  if(x.limite){var d=days(x.limite,today);lim=s==='Cerrado'?'Límite '+fd(x.limite):'<span class="lim '+(d<0?'late':d<=7?'soon':'')+'">'+(d<0?'Vencido hace '+(-d)+' día'+(d===-1?'':'s'):d===0?'Vence hoy':'Vence en '+d+' día'+(d===1?'':'s'))+'</span> ('+fd(x.limite)+')'}
  var last=(x.hist||[]).slice(-1)[0];
  return '<div class="act'+(s==='Vencido'?' late':'')+'"><div class="t">'+esc(x.tipo||'Hallazgo')+'</div><div class="pills">'+(x.criticidad?'<span class="pill cr-'+esc(x.criticidad)+'">'+esc(x.criticidad)+'</span>':'')+'<span class="pill st-'+s.replace(/ /g,'-')+'">'+esc(s)+'</span></div>'+
    (x.descripcion?'<div class="d">'+esc(x.descripcion)+'</div>':'')+
    '<div class="m"><span>📍 '+esc([x.centro,x.area,x.lugar].filter(Boolean).join(' · '))+'</span><span>👤 '+esc(x.responsable||'Sin responsable')+'</span>'+(lim?'<span>⏱ '+lim+'</span>':'')+'<span>📅 '+fd(x.fecha)+' · '+esc(x.reporta||'')+'</span></div>'+
    (x.accion?'<div class="av">Acción: '+esc(x.accion)+'</div>':'')+
    (last?'<div class="hist">'+esc(last.estado)+' · '+new Date(last.at).toLocaleDateString('es-CL')+' · '+esc(last.nombre)+(last.comentario?': '+esc(last.comentario):'')+'</div>':'')+
    '<div class="btns">'+(s!=='Cerrado'?'<button type="button" class="btn pri" data-ed="'+esc(x.id)+'">Actualizar / cerrar</button>':'<button type="button" class="btn" data-ed="'+esc(x.id)+'">Reabrir</button>')+
    (x.folder?'<a class="btn" target="_blank" rel="noopener" href="'+CFG.sp+x.folder.split('/').map(encodeURIComponent).join('/')+'">Ver en SharePoint ↗</a>':'')+'</div></div>'}

// ---------- Actualizar / cerrar ----------
var cur=null,evid=[];
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,50)}
function openSheet(x){cur=x;evid=[];$('#shSub').textContent=(x.tipo||'Hallazgo')+' · '+x.centro+(x.responsable?' · '+x.responsable:'');
  $$('[name=shEst]').forEach(function(r){r.checked=r.value===(st(x)==='Cerrado'?'Abierto':'Cerrado')});$('#shCom').value='';$('#shMsg').innerHTML='';$('#shNom').value=prof().name||'';drawEv();$('#sheet').classList.add('on');$('#shGo').disabled=false}
function drawEv(){var box=$('#shEv');$$('#shEv .ph,#shEv .doc').forEach(function(e){e.remove()});
  evid.forEach(function(f,i){var el=document.createElement('div');if(f.src){el.className='ph';el.innerHTML='<img alt=""><button type="button" aria-label="Quitar">✕</button>';el.querySelector('img').src=f.src}
    else{el.className='doc';el.innerHTML='📄 '+esc(f.name)+' <button type="button" aria-label="Quitar" style="border:0;background:none;cursor:pointer">✕</button>'}
    el.querySelector('button').onclick=function(){evid.splice(i,1);drawEv()};box.insertBefore(el,box.lastElementChild)})}
$('#shEvIn').onchange=function(){var fs=[].slice.call(this.files);this.value='';
  fs.forEach(function(f){if(/^image\//.test(f.type)){var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){evid.push({name:slug(f.name.replace(/\.[^.]+$/,''))+'.jpg',blob:b,src:c.toDataURL('image/jpeg',.5)});drawEv()},'image/jpeg',.8)};img.src=u}
    else if(f.size<=10*1048576){evid.push({name:slug(f.name.replace(/\.[^.]+$/,''))+(f.name.match(/\.[^.]+$/)||[''])[0],blob:f});drawEv()}})};
$('#shCancel').onclick=function(){$('#sheet').classList.remove('on')};
$('#sheet').onclick=function(e){if(e.target.id==='sheet')$('#sheet').classList.remove('on')};
function b64(blob){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){ok(String(r.result).split(',')[1]||'')};r.onerror=ko;r.readAsDataURL(blob)})}
async function sendEvidence(x,est,com,nom){
  var id='CHZ-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-GPRO',base=today+'_'+id,folder=(x.folder||('PRO_EHS/Terreno/Hallazgos/'+slug(x.centro)+'/'+x.id))+'/Cierre_'+base;
  var data={grupo:'Terreno',hallazgo:x.id,estado:est,comentario:com,cerradoPor:nom,fecha:today,archivos:evid.map(function(f){return f.name})};
  var backup=[{name:base+'_datos.json',mimeType:'application/json',base64:await b64(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}))}];
  for(var i=0;i<evid.length;i++)backup.push({name:base+'_'+evid[i].name,mimeType:evid[i].blob.type||'application/octet-stream',base64:await b64(evid[i].blob)});
  var txt='Hallazgo '+x.id+' · '+est+' · '+x.centro+(com?' · '+com:'')+' · '+nom;
  var r=await fetch(CFG.endpoint,{method:'POST',body:JSON.stringify({key:CFG.key,form:'Cierre de hallazgo',formCode:'HALLAZGO-CIERRE',recordId:id,subject:'[Cierre de hallazgo] '+x.id+' · '+x.centro,
    reporterName:nom,reporterEmail:'',cc:'',textBody:txt,htmlBody:esc(txt),attachments:[],sentAt:new Date().toISOString(),notify:false,emailOptional:true,folderPath:folder,fileBase:base,
    fields:{tipo:'Cierre de hallazgo: '+est,persona:nom,fecha:today,lugar:x.lugar||'',area:x.area||'',centro:x.centro,responsable:x.responsable||'',fecha_limite:''},grupo:'Terreno',backupFiles:backup})}).then(function(r){return r.json()});
  if(!r||!r.ok)throw new Error((r&&r.error)||'no se pudo enviar la foto');return folder}
$('#shGo').onclick=async function(){
  var x=cur,est=(document.querySelector('[name=shEst]:checked')||{}).value,com=$('#shCom').value.trim(),nom=$('#shNom').value.trim(),msg=$('#shMsg'),btn=this;
  if(!est){msg.innerHTML='<div class="msg err">Elige el estado.</div>';return}
  if(!nom){msg.innerHTML='<div class="msg err">Escribe tu nombre.</div>';return}
  if(est==='Cerrado'&&!evid.length){msg.innerHTML='<div class="msg err">Para cerrar el hallazgo adjunta una foto de la corrección.</div>';return}
  btn.disabled=true;msg.innerHTML='<div class="msg info">Guardando…</div>';
  try{var ev='';if(evid.length){msg.innerHTML='<div class="msg info">Subiendo foto…</div>';ev=await sendEvidence(x,est,com,nom)}
    var r=await fetch(CFG.endpoint,{method:'POST',body:JSON.stringify({key:CFG.key,action:'panelHz',id:x.id,estado:est,nombre:nom,comentario:com,evidencia:ev})}).then(function(r){return r.json()});
    if(!r||!r.ok)throw new Error((r&&r.error)||'no se pudo guardar');
    DATA.items=DATA.items.map(function(h){return h.id===x.id?r.item:h});LS.set('gpHzData',JSON.stringify(DATA));
    var p=prof();p.name=nom;LS.set('gpPerfil',JSON.stringify(p));
    msg.innerHTML='<div class="msg ok">✔ '+(est==='Cerrado'?'Hallazgo cerrado. La foto queda en su carpeta de SharePoint.':'Guardado.')+'</div>';
    setTimeout(function(){$('#sheet').classList.remove('on');render()},1100);
  }catch(e){msg.innerHTML='<div class="msg err">No se pudo guardar: '+esc(e.message)+'</div>';btn.disabled=false}
};
var sel=$('#fCentro'),p=prof();sel.innerHTML='<option value="">Todos los centros</option>'+CENTROS.map(function(c){return '<option>'+esc(c)+'</option>'}).join('');
sel.value=p.hzCentro!=null?p.hzCentro:(p.centro||'');sel.onchange=function(){var q=prof();q.hzCentro=sel.value;LS.set('gpPerfil',JSON.stringify(q));render()};
$('#fResp').oninput=render;
load();
})();
</script>
<script src="gp-app.js"></script>
