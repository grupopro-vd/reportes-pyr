function marcado(sum,lab){return new RegExp('\\[X\\]\\s*'+lab,'i').test(String(sum||''))}
function familia(cat,txt,origen){var c=norm(cat+' '+txt);
  if(/trayecto/.test(norm(cat))||/trayecto/.test(norm(origen)))return 'Trayecto';

  if(/caida de persona|resbal|tropez|cay(o|ó) al (piso|suelo)|caida a nivel|caida de altura/.test(c))return 'Caída de persona';

    area:f.area||'',lugar:f.lugar||'',empresa:f.empresa||'',cat:cat,desc:desc.slice(0,400),origen:origen,danos:danos,equipo:linea(s,/Equipo o maquinaria:\s*([^|\n]+)/i),parte:linea(s,/Parte lesionada[^:]*:\s*([^|\n]+)/i),
    lesion:marcado(s,'Personas'),fam:familia(cat,desc,origen)}}

async function cargar(force){
  $('#app').innerHTML='<div class="empty"><span class="spin"></span>Leyendo hallazgos y eventos…</div>';
  try{
    await loadScript(CFG.chart);
    var hz=fetch(CFG.endpoint+'?hz=1&key='+encodeURIComponent(CFG.key)+'&t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return {items:[]}});
    if(!REP){var ds=(await g('/sites/'+CFG.site+'/drives?$select=id,name,webUrl')).value;REP=(ds.filter(function(d){return /\/ReportesPYR$/i.test(decodeURIComponent(d.webUrl))})[0]||{}).id;if(!REP)throw new Error('No encontré la biblioteca ReportesPYR')}
    var files=[];
    async function hijos(path){var r=[],u='/drives/'+REP+'/root:/'+encPath(path)+':/children?$select=id,name,eTag,folder&$top=999';while(u){var d=await g(u).catch(function(){return {value:[]}});r=r.concat(d.value||[]);u=d['@odata.nextLink']||null}return r}
    async function walk(path,depth){var ls=await hijos(path),subs=[];ls.forEach(function(x){if(x.folder){if(depth<4)subs.push(path+'/'+x.name)}else if(/_datos\.json$/i.test(x.name))files.push(x)});for(var k=0;k<subs.length;k+=8)await Promise.all(subs.slice(k,k+8).map(function(p){return walk(p,depth+1)}))}
    for(var fi=0;fi<CFG.evFolders.length;fi++)await walk(CFG.evFolders[fi],0);
    var cache=force?{}:cacheGet(),out={},need=files.filter(function(f){var c=cache[f.id];if(c&&c.e===f.eTag){out[f.id]=c;return false}return true});
    for(var i=0;i<need.length;i+=20){
      var b=await g('/$batch',{method:'POST',ct:'application/json',body:JSON.stringify({requests:need.slice(i,i+20).map(function(f,j){return {id:String(j),method:'GET',url:'/drives/'+REP+'/items/'+f.id}})})});
      var resp=b.responses||[];
      var js=await Promise.all(resp.map(function(x){var u=x.body&&x.body['@microsoft.graph.downloadUrl'];return u?fetch(u).then(function(r){return r.json()}).catch(function(){return null}):null}));
      js.forEach(function(j,k){var f=need[i+(+resp[k].id)];if(f&&j&&j.fields)out[f.id]={e:f.eTag,d:desdeFR(j)}});
    }
    cacheSet(out);
    // Un evento puede tener Flash rápido y detallado: se agrupan por centro + persona + fecha
    var grupos={};Object.keys(out).map(function(k){return out[k].d}).forEach(function(r){
      if(/prueba/i.test(r.persona+' '+r.desc))return;if(MINE&&MINE.indexOf(r.centro)<0)return;
      var k=norm(r.centro)+'|'+norm(r.persona)+'|'+r.fecha;var gq=grupos[k];
      if(!gq){r.docs=[r.code];grupos[k]=r}else{gq.docs.push(r.code);if(r.code==='FR-DETALLADO'&&r.desc)gq.desc=r.desc;if(!gq.cat&&r.cat){gq.cat=r.cat;gq.fam=r.fam}}});
    EV=Object.keys(grupos).map(function(k){return grupos[k]});
    HZ=((await hz).items||[]).filter(function(h){return !MINE||MINE.indexOf(h.centro)>=0}).map(function(h){h.est=estadoHz(h);h.crit=h.criticidad||'Sin criticidad';return h});
    $('#dlBtn').disabled=false;render();
  }catch(e){$('#app').innerHTML='<div class="msg err">No se pudieron leer los datos: '+esc(e.message)+'</div>'}
}

// ---------- Período ----------
function rango(){var r=F.ref;
  if(F.per==='dia')return {a:r,b:r,lab:fdl(r)};
  if(F.per==='sem'){var l=lunes(r);return {a:l,b:add(l,6),lab:'Semana '+isoWeek(l)+' · '+l.slice(8,10)+'/'+l.slice(5,7)+' al '+add(l,6).slice(8,10)+'/'+add(l,6).slice(5,7)}}
  if(F.per==='mes'){var a=r.slice(0,8)+'01',d=new Date(+r.slice(0,4),+r.slice(5,7),0);return {a:a,b:iso(d),lab:MESL[+r.slice(5,7)-1]+' '+r.slice(0,4)}}
  if(F.per==='anio')return {a:r.slice(0,4)+'-01-01',b:r.slice(0,4)+'-12-31',lab:'Año '+r.slice(0,4)};
  return {a:'0000',b:'9999',lab:'Todo el registro'}}
function mover(n){var r=F.ref;if(F.per==='dia')F.ref=add(r,n);else if(F.per==='sem')F.ref=add(r,7*n);else if(F.per==='mes'){var d=new Date(+r.slice(0,4),+r.slice(5,7)-1+n,1);F.ref=iso(d)}else if(F.per==='anio')F.ref=(+r.slice(0,4)+n)+r.slice(4);render()}
// Buckets para la tendencia según el período elegido
function buckets(){var R=rango(),out=[];
  if(F.per==='dia'){for(var i=13;i>=0;i--){var d=add(F.ref,-i);out.push({a:d,b:d,l:d.slice(8,10)+'/'+d.slice(5,7)})}}
  else if(F.per==='sem'){var l=lunes(F.ref);for(var j=11;j>=0;j--){var a=add(l,-7*j);out.push({a:a,b:add(a,6),l:'S'+isoWeek(a)})}}
  else if(F.per==='mes'){for(var k=11;k>=0;k--){var dd=new Date(+F.ref.slice(0,4),+F.ref.slice(5,7)-1-k,1),aa=iso(dd),bb=iso(new Date(dd.getFullYear(),dd.getMonth()+1,0));out.push({a:aa,b:bb,l:MES[dd.getMonth()]+' '+String(dd.getFullYear()).slice(2)})}}
  else{var y=F.per==='anio'?+F.ref.slice(0,4):+HOY.slice(0,4);for(var m=0;m<12;m++){var d2=new Date(y,m,1);out.push({a:iso(d2),b:iso(new Date(y,m+1,0)),l:MES[m]})}}
  return out}

function kp(v,l,c,sub,dark){return '<div class="kpi'+(dark?' dark':'')+'"><b'+(c?' style="color:'+c+'"':'')+'>'+v+'</b><span>'+l+'</span>'+(sub?'<i style="color:'+(c||'#71717a')+'">'+sub+'</i>':'')+'</div>'}

// ---------- Gráficos ----------
function base(extra){return Object.assign({responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},
  scales:{x:{grid:{display:false},ticks:{font:{family:'Manrope',size:10},color:'#52525b'}},y:{beginAtZero:true,grid:{color:'#eeeef0'},ticks:{precision:0,font:{family:'Manrope',size:10},color:'#52525b'}}}},extra||{})}
var LEG={display:true,position:'bottom',labels:{font:{family:'Manrope',size:11},boxWidth:12}};
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;if(CH[id])CH[id].destroy();CH[id]=new Chart(el,cfg)}
function vacio(id){var c=document.getElementById(id);if(c)c.parentNode.innerHTML='<div class="note" style="padding-top:40px;text-align:center">Sin datos para mostrar.</div>'}
function donut(id,m,colors){var k=Object.keys(m).filter(function(x){return m[x]});if(!k.length){vacio(id);return}mk(id,{type:'doughnut',data:{labels:k,datasets:[{data:k.map(function(x){return m[x]}),backgroundColor:k.map(function(x,i){return (colors&&colors[x])||PAL[i%PAL.length]}),borderWidth:2,borderColor:'#fff'}]},
  options:{responsive:true,maintainAspectRatio:false,animation:false,cutout:'60%',plugins:{legend:LEG}}})}
function hbar(id,ps,color){if(!ps.length){vacio(id);return}mk(id,{type:'bar',data:{labels:ps.map(function(p){return corto(p[0],42)}),datasets:[{data:ps.map(function(p){return p[1]}),backgroundColor:ps.map(function(p){return (typeof color==='object'?color[p[0]]:color)||'#bd0926'}),borderRadius:4}]},
  options:base({indexAxis:'y',scales:{x:{beginAtZero:true,grid:{color:'#eeeef0'},ticks:{precision:0}},y:{grid:{display:false},ticks:{font:{family:'Manrope',size:10.5},color:'#3f3f46'}}}})})}
function stack(id,labels,series){mk(id,{type:'bar',data:{labels:labels,datasets:series.map(function(s){return {label:s[0],data:s[1],backgroundColor:s[2],borderRadius:2,stack:'a'}})},
  options:base({plugins:{legend:LEG},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{family:'Manrope',size:10}}},y:{stacked:true,beginAtZero:true,grid:{color:'#eeeef0'},ticks:{precision:0}}}})})}
function tendencia(id,src,series){var bk=buckets();var base0=src.filter(function(r){return (!F.centro||r.centro===F.centro)&&(!F.tipo||(VIEW==='hz'?r.tipo:r.fam)===F.tipo)});
  stack(id,bk.map(function(b){return b.l}),series.map(function(s){return [s[0],bk.map(function(b){return base0.filter(function(r){return r.fecha>=b.a&&r.fecha<=b.b&&s[1](r)}).length}),s[2]]}))}
function chartsHz(rows){if(!rows.length)return;
  donut('cHzEst',cnt(rows,function(r){return r.est}),HZC);hbar('cHzTipo',pairs(cnt(rows,function(r){return r.tipo})),'#18181b');donut('cHzCrit',cnt(rows,function(r){return r.crit}),CRC);
  var cs=uniq(rows.map(function(r){return r.centro})).sort();
  stack('cHzCen',cs.map(function(c){return c.replace(/^(Walmart|Líder)\s+/,'')}),['Abierto','En proceso','Vencido','Cerrado'].map(function(e){return [e,cs.map(function(c){return rows.filter(function(r){return r.centro===c&&r.est===e}).length}),HZC[e]]}));
  tendencia('cHzTen',HZ,[['Cerrados',function(r){return r.est==='Cerrado'},HZC.Cerrado],['Abiertos / en proceso',function(r){return r.est==='Abierto'||r.est==='En proceso'},HZC.Abierto],['Vencidos',function(r){return r.est==='Vencido'},HZC.Vencido]]);
  hbar('cHzArea',pairs(cnt(rows,function(r){return r.area||r.lugar})).slice(0,10),'#b45309')}
function chartsEv(rows){if(!rows.length)return;
  hbar('cEvFam',pairs(cnt(rows,function(r){return r.fam})),FAM);donut('cEvTipo',cnt(rows,function(r){return r.tipo}),{Accidente:'#b3261e',Incidente:'#b45309'});
  var cs=uniq(rows.map(function(r){return r.centro})).sort();
  stack('cEvCen',cs.map(function(c){return c.replace(/^(Walmart|Líder)\s+/,'')}),[['Accidentes',cs.map(function(c){return rows.filter(function(r){return r.centro===c&&r.tipo==='Accidente'}).length}),'#b3261e'],['Incidentes',cs.map(function(c){return rows.filter(function(r){return r.centro===c&&r.tipo!=='Accidente'}).length}),'#b45309']]);
  tendencia('cEvTen',EV,[['Accidentes',function(r){return r.tipo==='Accidente'},'#b3261e'],['Incidentes',function(r){return r.tipo!=='Accidente'},'#b45309']]);
  var dm={};rows.forEach(function(r){(r.danos.length?r.danos:['Sin dato']).forEach(function(d){dm[d]=(dm[d]||0)+1})});hbar('cEvDan',pairs(dm),'#7e22ce');
  hbar('cEvEq',pairs(cnt(rows,function(r){return (r.equipo&&r.equipo!=='—')?r.equipo:'Sin equipo'})).slice(0,10),'#1d4ed8')}
